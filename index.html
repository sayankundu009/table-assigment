<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row mb-3">
            <div class="col-12">
                <h1>🧑‍💻 Employee Directory</h1>
            </div>
        </div>

        <div class="row mb-3 align-items-center">
            <div class="col-lg-4 col-md-6 mb-2">
                <div class="input-group">
                    <span class="input-group-text">🔎</span>
                    <input type="text" class="form-control" placeholder="Search by name" aria-label="Search" aria-describedby="basic-addon1" id="name-filter">
                </div>
            </div>
            <div class="col-lg-2 col-md-3 mb-2">
                <select class="form-select" id="department-filter">
                    <option value="">All Departments</option>
                </select>
            </div>
            <div class="col-lg-2 col-md-3 mb-2">
                <select class="form-select" id="role-filter">
                    <option value="">All Roles</option>
                </select>
            </div>
            <div class="col-lg-2 col-md-3 mb-2">
                <select class="form-select" id="salary-filter">
                    <option value="">All Salaries</option>
                    <option value="1-60000">Less than 60,000</option>
                    <option value="60000-80000">60,000 - 80,000</option>
                    <option value="80000-100000">80,000 - 100,000</option>
                    <option value="100000-120000">100,000 - 120,000</option>
                    <option value="120000">More than 120,000</option>
                </select>
            </div>
            <div class="col-lg-2 col-md-6 mb-2 d-flex gap-2">
                <button type="button" class="btn btn-primary flex-fill" id="search">Filter</button>
                <button type="button" class="btn btn-secondary flex-fill" id="reset">Reset</button>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <table class="table table-bordered">
                    <thead class="table-light">
                        <tr>
                            <th>Name</th>
                            <th>Department</th>
                            <th>Role</th>
                            <th>Salary</th>
                        </tr>
                    </thead>
                    <tbody id="employee-table">
                        
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div id="backdrop" class="hidden">
        <h3>Employee Information</h3>
        <div id="basic">
        </div>
        <div id="nav">
            <button id="info_btn" class="active">Information</button>
            <button id="pro_btn">Projects</button>
        </div>
        <div id="info_list">
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
